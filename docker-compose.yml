version: '3.4'

services:
  utilitypaymentjournal:
    image: ${DOCKER_REGISTRY-}utilitypaymentjournal
    build:
      context: .
      dockerfile: UtilityPaymentJournal/Dockerfile
    depends_on:
      db:
        condition: service_healthy 

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: puser
      POSTGRES_PASSWORD: pg1weghnm457
      POSTGRES_DB: postgredb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puser -d postgredb"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata: