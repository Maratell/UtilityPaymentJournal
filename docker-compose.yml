version: '3.4'

services:
  utilitypaymentjournal:
    image: ${DOCKER_REGISTRY-}utilitypaymentjournal
    build:
      context: .
      dockerfile: UtilityPaymentJournal/Dockerfile
    depends_on:
      db:
        condition: service_healthy 
    ports:                           
      - "${APP_PORT}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};
      - Serilog__WriteTo__1__Args__configure__0__Args__serverUrl=http://seq_server:80

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 5

  seq_server:
    image: datalust/seq:2024.3
    container_name: seq_server
    restart: always
    environment:
      ACCEPT_EULA: "Y"
    ports:   
      - "${SEQ_PORT}:80"  

volumes:
  pgdata: